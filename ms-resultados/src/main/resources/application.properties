spring.application.name=ms-resultados
server.port=9081

# Base de datos H2 en archivo (persiste en ./data al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/resultadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para mostrar la base de datos: http://localhost:9081/h2-console
spring.h2.console.enabled=true
